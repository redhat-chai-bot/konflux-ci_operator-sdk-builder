name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install hadolint-py==2.15.1.2 yamllint>=1.35

      - name: Lint YAML
        run: yamllint .tekton files rpms.in.yaml

      - name: Lint Containerfile
        run: hadolint --failure-threshold error Containerfile
